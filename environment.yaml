name: spikes2lfp
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy=1.23.5  # allensdk requires numpy < 1.24
  - scipy=1.10.1
  - h5py=3.10.0
  - scikit-learn=1.3.2
  - pandas=1.5.3
  - matplotlib
  - seaborn       # notebooks
  - tqdm          # notebooks
  - optuna        # pool_sessions.ipynb (classifier tuning)
  - pytest

  - pip:
      - allensdk==2.16.2   # also installs pynwb, used directly by process_probe.py
      - pynwb==2.8.3       # read the NWB files (also used by allensdk)
      - hdmf>=3.14.5,<4    # hdmf 6 cannot read NWB files with pynwb 2.x
      - torch==2.1.0+cu118
      - --extra-index-url https://download.pytorch.org/whl/cu118
