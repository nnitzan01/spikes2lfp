name: spikes2lfp
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy=1.23.5  # Changed from 1.26.4 to be compatible with allensdk requirement (<1.24)
  - scipy=1.10.1
  - h5py=3.10.0
  - scikit-image=0.21.0
  - scikit-learn=1.3.2
  - pandas=1.5.3
  - matplotlib
  - seaborn

  - pip:
      - allensdk==2.16.2
      - torch==2.1.0+cu118
      - torchvision==0.16.0+cu118
      - torchaudio==2.1.0+cu118
      - captum==0.8.0
      - --extra-index-url https://download.pytorch.org/whl/cu118